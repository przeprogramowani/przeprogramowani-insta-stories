# Reusable pipeline: generate the Story for one newsletter, upload it to S3, publish it to Instagram.
name: Story pipeline

on:
  workflow_call:
    inputs:
      newsletter: { type: string, required: true }
      dry_run: { type: boolean, default: false }
      force: { type: boolean, default: false }
      fresh: { type: boolean, default: false, description: 'Ignore cached leads/background and generate new ones' }
    secrets:
      OPENROUTER_API_KEY: { required: true }
      META_ACCESS_TOKEN: { required: true }
      INSTAGRAM_USER_ID: { required: true }
      MAILERLITE_API_KEY: { required: false }
      FEED_RELAY_TOKEN: { required: false }
      OPANUJ_AI_INSTAGRAM_USER_ID: { required: false }
      AWS_ACCESS_KEY_ID: { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_REGION: { required: true }
      STORIES_S3_BUCKET: { required: true }
      STORIES_CDN_BASE: { required: true }

permissions:
  contents: write

jobs:
  story:
    runs-on: ubuntu-latest
    concurrency: { group: story-push, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }

      - run: npm ci

      # Leads + background are cached per issue (src/cache.mjs). Caches are immutable, so each run
      # saves under its own key and the next run restores the newest one for this newsletter.
      - name: Restore generation cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: story-${{ inputs.newsletter }}-${{ github.run_id }}
          restore-keys: story-${{ inputs.newsletter }}-

      - name: Generate Story image
        id: gen
        run: node src/cli.mjs generate ${{ inputs.newsletter }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          FEED_RELAY_TOKEN: ${{ secrets.FEED_RELAY_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '' }}
          FRESH: ${{ inputs.fresh && '1' || '' }}

      # Saved even when generation fails, so a retry doesn't pay again for what already succeeded.
      - name: Save generation cache
        if: always() && hashFiles('.cache/**') != ''
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: story-${{ inputs.newsletter }}-${{ github.run_id }}

      - name: Attach image to the run
        if: steps.gen.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with: { name: 'story-${{ inputs.newsletter }}', path: '${{ steps.gen.outputs.file }}' }

      # Instagram fetches the image from a public URL. Dry runs upload too, so the preview has a URL
      # (content-hashed key, so the real run after an unchanged dry run reuses the same object).
      - name: Upload image to S3
        id: upload
        if: steps.gen.outputs.skip == 'false'
        run: node src/cli.mjs upload ${{ inputs.newsletter }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          STORIES_S3_BUCKET: ${{ secrets.STORIES_S3_BUCKET }}
          STORIES_CDN_BASE: ${{ secrets.STORIES_CDN_BASE }}

      - name: Publish to Instagram Stories
        id: publish
        if: steps.upload.outcome == 'success' && !inputs.dry_run
        run: node src/cli.mjs publish ${{ inputs.newsletter }}
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          OPANUJ_AI_INSTAGRAM_USER_ID: ${{ secrets.OPANUJ_AI_INSTAGRAM_USER_ID }}

      # published.json is the dedupe log, the only thing this pipeline still commits.
      - name: Record published Story
        if: steps.publish.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.json
          git commit -m "story(${{ inputs.newsletter }}): published ${{ steps.gen.outputs.file }}"
          git pull --rebase && git push
