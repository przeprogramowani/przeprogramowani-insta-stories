name: Przeprogramowany Newsletter Story

on:
  schedule:
    # Sunday 09:00 Europe/Warsaw = 07:00 UTC (CEST) / 08:00 UTC (CET); the pipeline gates on local time.
    - cron: '0 7 * * 0'
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate only (image attached to the run), do not publish'
        type: boolean
        default: true
      force:
        description: 'Run even if the latest issue already had a Story'
        type: boolean
        default: false
      fresh:
        description: 'Ignore cached leads/background and generate new ones'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  story:
    uses: ./.github/workflows/story.yml
    with:
      newsletter: przeprogramowani
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      fresh: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh }}
    secrets: inherit
